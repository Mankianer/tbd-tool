[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tbd-tool"
version = "0.1.0"
description = "Protokolle des TBD in einen Obsidian-Vault überführen"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.5",
    "PyYAML>=6.0",
    "requests>=2.28",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
tbd = "tbd.cli:main"

[tool.setuptools.packages.find]
include = ["tbd*"]

[tool.setuptools.package-data]
"*" = ["*.md"]
"tbd" = ["templates/*.md"]
